# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
#
# Wiki interna (Wiki.js 2.x em Kubernetes, https://wiki.exemplo.net.br):
# login OIDC pelo SSO público (https://sso.exemplo.net.br).
#
# - Quem entra: membros de wiki-leitura ou wiki-escrita. O Wiki.js exige
#   e-mail: o usuário precisa ter e-mail no authentik.
# - Permissões: no Wiki.js, estratégia OIDC com "Map Groups" LIGADO e grupos com
#   os MESMOS nomes (wiki-leitura = ler; wiki-escrita = ler e editar). A cada
#   login o Wiki.js põe o usuário nos grupos do claim "groups" e TIRA dos demais
#   (só nas contas do SSO; as contas locais não mudam).
# - client_secret: gerado pelo authentik na criação (não fica no git). Para ver:
#   Aplicações > Providers > provedor-wiki.
# - Redirect: o Wiki.js usa /login/<id-da-estratégia>/callback; o id só existe
#   depois de criar a estratégia no Wiki.js, por isso a regex.
# - O Wiki.js (servidor) chama token/userinfo/jwks no sso. pela internet: o IP de
#   saída do Kubernetes precisa passar no filtro "só Brasil" do Caddy da VPS.
version: 1
metadata:
  name: Exemplo - Wiki
  labels:
    blueprints.goauthentik.io/description: Login OIDC da wiki interna (Wiki.js), grupos wiki-leitura e wiki-escrita
entries:
  - model: authentik_core.group
    id: grupo-leitura
    identifiers:
      name: wiki-leitura
    attrs:
      attributes:
        descricao: Wiki interna - somente leitura (grupo de mesmo nome no Wiki.js)

  - model: authentik_core.group
    id: grupo-escrita
    identifiers:
      name: wiki-escrita
    attrs:
      attributes:
        descricao: Wiki interna - leitura e edição (grupo de mesmo nome no Wiki.js)

  - model: authentik_providers_oauth2.oauth2provider
    id: provider
    identifiers:
      name: provedor-wiki
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: wiki-provedor
      # No authentik 2026.8 o padrão é lista vazia = tudo recusado ("The request
      # is otherwise malformed" / "Invalid grant_type for provider").
      grant_types:
        - authorization_code
        - refresh_token
      redirect_uris:
        - matching_mode: regex
          url: '^https://wiki\.exemplo\.net\.br/login/[0-9a-f-]+/callback$'
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      # O Wiki.js guarda o "sub" como id do usuário: o hash não muda se o
      # username for trocado.
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]

  - model: authentik_core.application
    id: aplicacao
    identifiers:
      slug: wiki
    attrs:
      name: Wiki Exemplo
      provider: !KeyOf provider
      meta_description: Documentação interna
      meta_launch_url: https://wiki.exemplo.net.br
      policy_engine_mode: any

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf aplicacao
      group: !KeyOf grupo-leitura
      order: 0

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf aplicacao
      group: !KeyOf grupo-escrita
      order: 1
