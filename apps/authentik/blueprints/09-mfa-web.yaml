# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
#
# 2FA (TOTP) obrigatório no LOGIN WEB (https://sso.exemplo.net.br):
# portal, wiki, painel TACACS+ e demais sistemas pelo SSO.
#
# Quem ainda não tem autenticador é levado a cadastrar o TOTP no próximo login.
# Não vale para os equipamentos: RADIUS e LDAP/TACACS+ usam o fluxo
# provedor-radius-autenticacao, sem MFA (01-fluxo-autenticacao.yaml).
version: 1
metadata:
  name: Exemplo - 2FA no login web
  labels:
    blueprints.goauthentik.io/description: TOTP obrigatório no login web (não nos equipamentos)
entries:
  # O blueprint padrão cria o estágio; aplicá-lo antes evita que uma reaplicação
  # dele venha depois desta. (Ele só define o nome, não as opções abaixo.)
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Default - Authentication flow
      required: false

  - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
    identifiers:
      name: default-authentication-mfa-validation
    attrs:
      device_classes:
        - static
        - totp
        - webauthn
      # Sem autenticador: obriga a cadastrar o TOTP (antes: "skip").
      not_configured_action: configure
      configuration_stages:
        - !Find [authentik_stages_authenticator_totp.authenticatortotpstage, [name, default-authenticator-totp-setup]]
