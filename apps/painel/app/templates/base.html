<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block titulo %}Painel TACACS+{% endblock %} - Exemplo</title>
<style>
:root{color-scheme:light dark;--bg:#f5f6f8;--card:#fff;--tx:#1b1f24;--mut:#6a737d;--bd:#d8dce1;--ac:#0b6bcb;--ok:#1a7f37;--err:#c62828;--wr:#9a6700}
@media (prefers-color-scheme:dark){:root{--bg:#14171b;--card:#1d2127;--tx:#e6e9ed;--mut:#98a2ad;--bd:#343b44;--ac:#5aa9f5;--ok:#4cc26b;--err:#ff7b72;--wr:#d4a72c}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,sans-serif}
a{color:var(--ac);text-decoration:none}a:hover{text-decoration:underline}
header{background:var(--card);border-bottom:1px solid var(--bd);padding:.6rem 1rem;display:flex;flex-wrap:wrap;gap:.5rem 1rem;align-items:center}
header b{font-size:1.05rem}nav{display:flex;flex-wrap:wrap;gap:.8rem;flex:1}header form{margin:0}
main{padding:1rem;max-width:1200px;margin:0 auto}
h1{font-size:1.3rem;margin:.2rem 0 1rem}h2{font-size:1.05rem;margin:1.2rem 0 .5rem}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.7rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:.7rem .9rem}
.card .n{font-size:1.6rem;font-weight:600}.card .l{color:var(--mut);font-size:.85rem}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1rem}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--bd);border-radius:8px}
table{border-collapse:collapse;width:100%}th,td{padding:.4rem .6rem;text-align:left;border-bottom:1px solid var(--bd);vertical-align:top}
th{color:var(--mut);font-weight:600;font-size:.8rem;white-space:nowrap}tr:last-child td{border-bottom:0}
td.cmd{word-break:break-word;min-width:12rem}
.ok{color:var(--ok)}.err{color:var(--err)}.wr{color:var(--wr)}.mut{color:var(--mut)}
form.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.6rem;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:.8rem;margin-bottom:1rem}
label{display:flex;flex-direction:column;font-size:.8rem;color:var(--mut);gap:.2rem}
input,select,button{font:inherit;padding:.4rem .5rem;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);min-width:0}
button,.btn{background:var(--ac);color:#fff;border-color:var(--ac);cursor:pointer;display:inline-block;padding:.4rem .8rem;border-radius:6px}
button.sec,.btn.sec{background:transparent;color:var(--ac)}
.acoes{display:flex;gap:.5rem;align-items:flex-end;flex-wrap:wrap}
.pag{display:flex;gap:1rem;align-items:center;margin:.8rem 0;flex-wrap:wrap}
.tabs a{margin-right:.8rem}.tabs a.at{font-weight:700;text-decoration:underline}
</style></head><body>
<header><b>Painel TACACS+</b>
<nav><a href="{{ url_for('geral') }}">Visão geral</a><a href="{{ url_for('eventos') }}">Eventos</a><a href="{{ url_for('sessoes') }}">Sessões</a></nav>
{% if session.get('usuario') %}<form method="post" action="{{ url_for('sair') }}"><span class="mut">{{ session.nome }}</span> <button class="sec" type="submit">Sair</button></form>{% endif %}
</header><main>{% block corpo %}{% endblock %}</main></body></html>
