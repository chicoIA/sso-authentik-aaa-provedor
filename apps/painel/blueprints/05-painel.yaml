# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
#
# Painel TACACS+: provider OAuth2 (OIDC), aplicação e grupos com acesso.
# Aplicado automaticamente (montado em /blueprints/provedor/painel).
# Depende de provedor/tacacs/04-tacacs.yaml (grupo tacacs-admin).
# Variáveis lidas no container authentik-server: PAINEL_OIDC_SECRET, PAINEL_URL_EXTERNA.
version: 1
metadata:
  name: Exemplo - Painel TACACS+
  labels:
    blueprints.goauthentik.io/description: Login OIDC do painel TACACS+ (grupos painel-tacacs e tacacs-admin)
entries:
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        path: provedor/tacacs/04-tacacs.yaml
      required: true

  - model: authentik_core.group
    id: grupo-painel
    identifiers:
      name: painel-tacacs
    attrs:
      attributes:
        descricao: Pode ver o painel TACACS+ (somente leitura)

  - model: authentik_providers_oauth2.oauth2provider
    id: provider
    identifiers:
      name: painel-tacacs
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: painel-tacacs
      client_secret: !Env [PAINEL_OIDC_SECRET, ""]
      # No authentik 2026.8 o padrão é lista vazia = tudo recusado ("Invalid
      # grant_type for provider"); mesmo problema visto na Wiki.
      grant_types:
        - authorization_code
        - refresh_token
      redirect_uris:
        - matching_mode: strict
          url: !Format ["%s/auth/callback", !Env [PAINEL_URL_EXTERNA, "http://100.66.80.196:9049"]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      sub_mode: user_username
      include_claims_in_id_token: true
      # O claim "groups" vem do escopo profile.
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]

  - model: authentik_core.application
    id: aplicacao
    identifiers:
      slug: painel-tacacs
    attrs:
      name: Painel TACACS+
      provider: !KeyOf provider
      meta_description: Logins, comandos e sessões dos equipamentos via TACACS+
      meta_launch_url: !Env [PAINEL_URL_EXTERNA, "http://100.66.80.196:9049"]
      policy_engine_mode: any

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf aplicacao
      group: !KeyOf grupo-painel
      order: 0

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf aplicacao
      group: !Find [authentik_core.group, [name, tacacs-admin]]
      order: 1
