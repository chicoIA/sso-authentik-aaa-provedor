# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
#
# NetBox: login OIDC pelo SSO público (python-social-auth, já embutido no NetBox).
# Roteiro do lado do NetBox em docs/netbox-sso.md.
#
# NetBox 4.4 (netbox-docker) em https://infra.exemplo.net.br, no cluster Kubernetes.
# A cópia em apps/authentik/blueprints/13-netbox.yaml é a que vale
# (pasta vigiada); manter as duas iguais.
#
# - Quem entra: membros de netbox-leitura, netbox-editor ou netbox-admin. O papel é
#   aplicado a cada login pelo pipeline apps/netbox/provedor_sso.py (no NetBox).
# - O servidor do NetBox chama token/userinfo em sso.exemplo.net.br: precisa
#   sair para a internet com IP do Brasil (filtro do Caddy da VPS), como o Grafana.
# - client_secret: gerado pelo authentik na criação (não fica no git). Para ver:
#   Aplicações > Providers > provedor-netbox.
version: 1
metadata:
  name: Exemplo - NetBox
  labels:
    blueprints.goauthentik.io/description: Login OIDC do NetBox, grupos netbox-leitura/editor/admin
entries:
  - model: authentik_core.group
    id: grupo-leitura
    state: created
    identifiers:
      name: netbox-leitura
    attrs:
      attributes:
        descricao: NetBox - só leitura

  - model: authentik_core.group
    id: grupo-editor
    state: created
    identifiers:
      name: netbox-editor
    attrs:
      attributes:
        descricao: NetBox - cria e edita objetos

  - model: authentik_core.group
    id: grupo-admin
    state: created
    identifiers:
      name: netbox-admin
    attrs:
      attributes:
        descricao: NetBox - superusuário

  - model: authentik_providers_oauth2.oauth2provider
    id: provider
    identifiers:
      name: provedor-netbox
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: netbox
      # No authentik 2026.8 o padrão é lista vazia = tudo recusado.
      grant_types:
        - authorization_code
        - refresh_token
      redirect_uris:
        - matching_mode: strict
          url: https://infra.exemplo.net.br/oauth/complete/oidc/
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]

  - model: authentik_core.application
    id: aplicacao
    identifiers:
      slug: netbox
    attrs:
      name: NetBox
      provider: !KeyOf provider
      meta_description: Inventário e IPAM
      meta_launch_url: https://infra.exemplo.net.br/login/
      policy_engine_mode: any

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf aplicacao
      group: !KeyOf grupo-leitura
      order: 0

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf aplicacao
      group: !KeyOf grupo-editor
      order: 1

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf aplicacao
      group: !KeyOf grupo-admin
      order: 2
