! /etc/frr/frr.conf da VM Radius. Fonte: apps/host/frr/frr.conf no git.
! VM = AS 65020 (privado). Vizinho: switch Huawei S12700 (AS 64500) pela /30 nova
!   172.16.7.9 (roteador) <-> 172.16.7.10 (VM), interface ens224.
!
! Desde a fase 7: a VM anuncia o 100.66.80.196/32 (dummy radius0) ao S12700.
! Se a radius0 cair, o "network" some e o /32 é retirado sozinho.
!
! Rota padrão, em camadas (a primeira que valer ganha):
!   1. BGP: a 0.0.0.0/0 do S12700 (default-route-advertise), distância 20,
!      origem .196 (ORIGEM-196). Se a sessão BGP/BFD cair, ela some.
!   2. Reserva pelo MikroTik BORDA-A 100.66.80.193 na ens192 (onlink, a
!      ens192 fica sem IP), distância 250, origem .196: é o mesmo caminho por onde
!      o /26 volta a entregar o .196 quando o /32 é retirado. Some quando a ens192
!      for retirada (fim da migração para o BGP, docs/failover-vps.md).
!   3. Estática pelo 172.16.7.9 (resolve pela /30 conectada), distância 254,
!      origem do kernel (172.16.7.10, que está no OSPF pelo S12700): mantém a
!      gerência e a réplica vivas se só o BGP cair. Sem o /32 o .196 não recebe
!      nada por aqui, por isso não força origem .196.
! Os NAS só aceitam resposta do .196: o FreeRADIUS escuta em "*" e responde com
! o endereço que recebeu, independente da rota.
! Não usar rota padrão no kernel (ifupdown): o zebra prefere a rota do kernel
! (distância 0) e não instalaria a do BGP.
!
frr defaults traditional
hostname radius-vm
log syslog informational
service integrated-vtysh-config
!
route-map NADA deny 10
!
ip prefix-list SO-DEFAULT seq 5 permit 0.0.0.0/0
!
route-map ENTRADA permit 10
 match ip address prefix-list SO-DEFAULT
route-map ENTRADA deny 99
!
route-map ORIGEM-196 permit 10
 set src 100.66.80.196
!
route-map ORIGEM-ESTATICA permit 10
 match interface ens192
 set src 100.66.80.196
route-map ORIGEM-ESTATICA permit 20
!
ip protocol bgp route-map ORIGEM-196
ip protocol static route-map ORIGEM-ESTATICA
!
ip route 0.0.0.0/0 100.66.80.193 ens192 onlink 250
ip route 0.0.0.0/0 172.16.7.9 254
!
ip prefix-list SAIDA-RADIUS seq 10 permit 100.66.80.196/32
ip prefix-list SAIDA-RADIUS seq 999 deny 0.0.0.0/0 le 32
!
route-map SAIDA permit 10
 match ip address prefix-list SAIDA-RADIUS
route-map SAIDA deny 99
!
router bgp 65020
 bgp router-id 172.16.7.10
 bgp log-neighbor-changes
 timers bgp 3 9
 !
 neighbor 172.16.7.9 remote-as 64500
 neighbor 172.16.7.9 description roteador AS64500 via ens224 (anycast .196)
 neighbor 172.16.7.9 bfd profile rapido
 !
 address-family ipv4 unicast
  network 100.66.80.196/32
  neighbor 172.16.7.9 route-map ENTRADA in
  neighbor 172.16.7.9 route-map SAIDA out
 exit-address-family
!
bfd
 profile rapido
  detect-multiplier 3
  receive-interval 300
  transmit-interval 300
!
