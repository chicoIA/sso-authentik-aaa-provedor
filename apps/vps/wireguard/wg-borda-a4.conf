# Túnel VPS <-> BORDA-A, site A (core, AS 64500; underlay IPv4).
# Fonte: apps/vps/wireguard no git.
# Table = off: o wg-quick não cria rotas; quem decide o caminho é o BGP (FRR).
[Interface]
PostUp = wg set %i private-key /etc/wireguard/vps-borda-a.key
ListenPort = 51822
# /31 do túnel: BORDA-A = 172.16.20.4, VPS = 172.16.20.5
Address = 172.16.20.5/31
Table = off
MTU = 1420

[Peer]
# BORDA-A
PublicKey = <CHAVE_PUBLICA_WIREGUARD>
# Sem Endpoint: a VPS aprende IP/porta do roteador a cada handshake (roaming).
# Quem inicia é o roteador (endpoint 203.0.113.85:51822 + keepalive 15s).
AllowedIPs = 0.0.0.0/0, ::/0
PersistentKeepalive = 15
