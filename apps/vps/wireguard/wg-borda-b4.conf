# Túnel VPS <-> BORDA-B (underlay IPv4). Fonte: apps/vps/wireguard no git.
# Table = off: o wg-quick não cria rotas; quem decide o caminho é o BGP (FRR).
[Interface]
PostUp = wg set %i private-key /etc/wireguard/vps.key
ListenPort = 51821
# /31 do túnel: BORDA-B = 172.17.55.6, VPS = 172.17.55.7
Address = 172.17.55.7/31
Table = off
MTU = 1420

[Peer]
# BORDA-B
PublicKey = <CHAVE_PUBLICA_WIREGUARD>
# Sem Endpoint: a VPS aprende IP/porta do roteador a cada handshake (roaming).
# Quem inicia é o roteador (endpoint + keepalive 15s), inclusive por link
# de redundância atrás de NAT/CGNAT, sem IP válido.
AllowedIPs = 0.0.0.0/0, ::/0
PersistentKeepalive = 15
