# Estado da reserva RADIUS/SSO (ver apps/vps/reserva/)
extend provedor-reserva-codigo /usr/local/sbin/provedor-reserva-snmp codigo
extend provedor-reserva-texto /usr/local/sbin/provedor-reserva-snmp texto
