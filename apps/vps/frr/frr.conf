! /etc/frr/frr.conf da VPS VPS-RESERVA. Fonte: apps/vps/frr/frr.conf no git.
! VPS = AS 65010 (privado). Vizinhos (underlay IPv4):
!   BORDA-B (AS 65030), wg-borda-b4  (172.17.55.6 <-> 172.17.55.7) - preferido
!   BORDA-A      (AS 64500), wg-borda-a4 (172.16.20.4 <-> 172.16.20.5) - reserva
! Túneis com underlay IPv6 na última fase.
!
frr defaults traditional
hostname vps-reserva
log syslog informational
service integrated-vtysh-config
!
! ---- O que a VPS ACEITA: só redes internas (para responder aos NAS).
! Nunca a rota padrão nem prefixos públicos: o Caddy atende
! clientes pela internet e precisam continuar saindo pela eth0.
ip prefix-list ENTRADA-INTERNAS seq 5  deny 0.0.0.0/0
ip prefix-list ENTRADA-INTERNAS seq 10 deny 100.66.80.196/32
! seq 15: rede da VPN do NOC, se o concentrador ficar na própria VPS (docs/wireguard.md);
! se ficar na rede interna, apague esta linha para a VPS aprender a rota.
ip prefix-list ENTRADA-INTERNAS seq 15 deny 10.99.99.0/24 le 32
ip prefix-list ENTRADA-INTERNAS seq 20 deny 192.168.0.0/16 le 32
ip prefix-list ENTRADA-INTERNAS seq 25 deny 172.17.55.6/31 le 32
ip prefix-list ENTRADA-INTERNAS seq 26 deny 172.16.20.4/31 le 32
ip prefix-list ENTRADA-INTERNAS seq 100 permit 100.64.0.0/10 le 32
ip prefix-list ENTRADA-INTERNAS seq 110 permit 172.16.0.0/12 le 32
ip prefix-list ENTRADA-INTERNAS seq 120 permit 10.0.0.0/8 le 32
ip prefix-list ENTRADA-INTERNAS seq 999 deny 0.0.0.0/0 le 32
!
! ---- O que a VPS ANUNCIA: só o IP de serviço do RADIUS, e só quando a
! interface dummy radius0 (com o .196) existir e estiver up — o verificador de
! saúde sobe/desce a interface; a rota conectada some e o anúncio acompanha.
ip prefix-list SAIDA-SERVICO seq 10 permit 100.66.80.196/32
ip prefix-list SAIDA-SERVICO seq 999 deny 0.0.0.0/0 le 32
!
route-map ENTRADA permit 10
 match ip address prefix-list ENTRADA-INTERNAS
route-map ENTRADA deny 99
!
! Mesmas redes vindas do core: local-preference menor, o BORDA-B continua sendo o
! caminho (não muda o caminho do SSO); o core assume se o BORDA-B cair.
route-map ENTRADA-RESERVA permit 10
 match ip address prefix-list ENTRADA-INTERNAS
 set local-preference 50
route-map ENTRADA-RESERVA deny 99
!
! A VPS é RESERVA: AS-path mais longo para a VM vencer sempre que estiver no ar.
route-map SAIDA permit 10
 match ip address prefix-list SAIDA-SERVICO
 set as-path prepend 65010 65010 65010
route-map SAIDA deny 99
!
router bgp 65010
 bgp router-id 172.17.55.7
 bgp log-neighbor-changes
 timers bgp 3 9
 !
 neighbor 172.17.55.6 remote-as 65030
 neighbor 172.17.55.6 description BORDA-B via wg-borda-b4
 neighbor 172.17.55.6 bfd profile rapido
 !
 neighbor 172.16.20.4 remote-as 64500
 neighbor 172.16.20.4 description BORDA-A via wg-borda-a4
 neighbor 172.16.20.4 bfd profile rapido
 !
 address-family ipv4 unicast
  redistribute connected route-map SAIDA
  neighbor 172.17.55.6 route-map ENTRADA in
  neighbor 172.17.55.6 route-map SAIDA out
  neighbor 172.17.55.6 maximum-prefix 5000
  neighbor 172.16.20.4 route-map ENTRADA-RESERVA in
  neighbor 172.16.20.4 route-map SAIDA out
  neighbor 172.16.20.4 maximum-prefix 5000
 exit-address-family
!
! Túneis pela internet: com 300 ms x 3 as sessões caem a cada perda curta
! de pacotes. 1 s x 3 = detecção em 3 s. O
! intervalo é negociado pelo maior valor, então vale também para o lado dos
! roteadores (que seguem com 200-300 ms configurados).
bfd
 profile rapido
  detect-multiplier 3
  receive-interval 1000
  transmit-interval 1000
!
