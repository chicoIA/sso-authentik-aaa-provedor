#  Encaminhamento da autenticação PAP para o outpost RADIUS do authentik.

proxy server {
	#  Nunca encaminhar para "DEFAULT" por acidente.
	default_fallback = no
}

#  Outpost RADIUS do authentik (provider "provedor-radius-equipamentos"),
#  publicado pelo app radius em 127.0.0.1:OUTPOST_RADIUS_PORTA (padrão 18120).
home_server authentik_equipamentos {
	type = auth
	ipaddr = $ENV{AUTHENTIK_OUTPOST_IP}
	port = $ENV{OUTPOST_RADIUS_PORTA}
	secret = $ENV{AUTHENTIK_RADIUS_SECRET}

	#  Enlace local (loopback): não exige Message-Authenticator na resposta.
	require_message_authenticator = no

	#  O authentik executa um fluxo a cada login (com MFA, ou logo depois de
	#  reiniciar, pode levar vários segundos). Os equipamentos retransmitem;
	#  o FreeRADIUS deduplica e responde assim que o authentik responder.
	response_window = 20
	zombie_period = 40
	revive_interval = 30

	#  O outpost não responde a Status-Server.
	status_check = none
}

home_server_pool authentik_equipamentos {
	type = fail-over
	home_server = authentik_equipamentos
}

#  nostrip: o nome de usuário segue literal (ex.: fulano@exemplo.net.br).
realm AUTHENTIK_EQUIPAMENTOS {
	auth_pool = authentik_equipamentos
	nostrip
}

#  Revalidação em segundo plano (sites-available/provedor, server revalidar):
#  o módulo replicate envia para cá uma cópia do pedido respondido pela reserva.
home_server provedor_revalidar {
	type = auth
	ipaddr = 127.0.0.1
	port = $ENV{FR_PORTA_REVALIDA}
	secret = $ENV{FR_SEGREDO_LOCAL}
	require_message_authenticator = no
	response_window = 30
	status_check = none
}

home_server_pool provedor_revalidar {
	type = fail-over
	home_server = provedor_revalidar
}

realm PROVEDOR_REVALIDAR {
	auth_pool = provedor_revalidar
	nostrip
}
