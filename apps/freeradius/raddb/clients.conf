#  Clientes (NAS) do FreeRADIUS.
#
#  Os equipamentos NÃO ficam aqui: são lidos da tabela "nas" do daloRADIUS
#  (mods-available/sql: read_clients = yes, client_table = "nas"), SOMENTE
#  LEITURA, exatamente como o FreeRADIUS do sistema faz hoje (entradas CIDR,
#  inclusive 0.0.0.0/0). Continue cadastrando NAS pelo daloRADIUS.
#  Segredos nunca são copiados para arquivos.
#
#  Só o localhost fica aqui: healthcheck do container e testes (radclient).
client localhost {
	ipaddr = 127.0.0.1
	secret = $ENV{FR_SEGREDO_LOCAL}
	shortname = localhost
	nas_type = other
}
